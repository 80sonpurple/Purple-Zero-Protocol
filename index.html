<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Zero Protocol</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:purple;
    color:red;
    text-align:center;
}

header{
    background:#6a0dad;
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.section{
    margin:30px auto;
    max-width:700px;
}

button{
    background:orange;
    color:black;
    border:none;
    padding:12px 24px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
    border-radius:8px;
    font-weight:bold;
}

button:hover{
    filter:brightness(1.1);
}

iframe{
    width:100%;
    height:80vh;
    border:none;
    display:none;
    background:white;
}

#backButton{
    display:none;
    margin:15px;
}
</style>
</head>

<body>

<header>Purple Zero Protocol</header>

<div id="homePage" class="container">

    <div class="section">
        <h2>Game Selection</h2>

        <button onclick="openEmbed('https://play.fancade.com/6A5BF250C3D9E8B9')">
            Purple Zero Protocol
        </button>
    </div>

    <div class="section">
        <h2>Extras</h2>

        <button onclick="openEmbed('https://docs.google.com/document/d/131vcI20DpqOaVLlA5TGxZKmyqLS_UO_3anJ5xsQ9Wq8/edit?usp=drivesdk')">
            Purple Zero Protocol: Official Manual
        </button>
    </div>

</div>

<button id="backButton" onclick="goHome()">👈 Back</button>

<iframe id="embedFrame"></iframe>

<script>
const frame = document.getElementById("embedFrame");
const home = document.getElementById("homePage");
const back = document.getElementById("backButton");

function openEmbed(url){
    home.style.display = "none";
    frame.style.display = "block";
    back.style.display = "inline-block";
    frame.src = url;
}

function goHome(){
    frame.src = "";
    frame.style.display = "none";
    back.style.display = "none";
    home.style.display = "block";
}
</script>

</body>
</html>
