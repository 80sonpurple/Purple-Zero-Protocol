
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purple Zero Protocol</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: purple;
    color: red;
    text-align: center;
}

/* =========================
   HOME PAGE
========================= */

#homePage {
    display: block;
    min-height: 100dvh;
}

header {
    background: #6a0dad;
    padding: 20px;
    font-size: 32px;
    font-weight: bold;
}

.container {
    padding: 20px;
}

.section {
    margin: 30px auto;
    max-width: 700px;
}

button {
    background: orange;
    color: black;
    border: none;
    padding: 12px 24px;
    margin: 8px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 8px;
    font-weight: bold;
}

button:hover {
    filter: brightness(1.1);
}

/* =========================
   FULL-SCREEN EMBED VIEW
========================= */

#embedPage {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    background: black;

    display: none;
    flex-direction: column;

    z-index: 999;
}

/* =========================
   EMBED
========================= */

#embedFrame {
    display: block;

    width: 100%;
    height: calc(100dvh - 55px);

    flex: 1;

    border: none;
    background: black;
}

/* =========================
   CONTROL BAR
========================= */

#controls {
    width: 100%;
    height: 55px;
    min-height: 55px;

    background: #222;

    display: flex;
    align-items: center;

    padding: 5px 10px;
}

#backButton {
    display: block;

    margin: 0;

    padding: 9px 18px;

    background: orange;
    color: black;

    border-radius: 8px;

    font-size: 16px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #embedFrame {
        height: calc(100dvh - 50px);
    }

    #controls {
        height: 50px;
        min-height: 50px;
    }

    #backButton {
        padding: 8px 14px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HOME PAGE
========================= -->

<div id="homePage">

    <header>
        Purple Zero Protocol
    </header>

    <div class="container">

        <div class="section">

            <h2>Game Selection</h2>

            <button onclick="openEmbed('https://play.fancade.com/6A5BF250C3D9E8B9')">
                Purple Zero Protocol
            </button>

        </div>


        <div class="section">

            <h2>Extras</h2>

            <button onclick="openEmbed('https://docs.google.com/document/d/131vcI20DpqOaVLlA5TGxZKmyqLS_UO_3anJ5xsQ9Wq8/edit?usp=drivesdk')">
                Purple Zero Protocol: Official Manual
            </button>

        </div>

    </div>

</div>


<!-- =========================
     FULL-SCREEN EMBED PAGE
========================= -->

<div id="embedPage">

    <iframe
        id="embedFrame"
        allowfullscreen>
    </iframe>

    <div id="controls">

        <button
            id="backButton"
            onclick="goHome()">
            👈 Back
        </button>

    </div>

</div>


<script>

const frame = document.getElementById("embedFrame");
const home = document.getElementById("homePage");
const embedPage = document.getElementById("embedPage");


function openEmbed(url) {

    home.style.display = "none";

    embedPage.style.display = "flex";

    frame.src = url;
}


function goHome() {

    frame.src = "";

    embedPage.style.display = "none";

    home.style.display = "block";
}

</script>

</body>
</html>
```
